name: Benchmark Validation

on:
  push:
    paths:
      - 'data/benchmark/**'
      - 'scripts/benchmark_validate.py'
      - 'src/**'
  pull_request:
    paths:
      - 'data/benchmark/**'
      - 'scripts/benchmark_validate.py'
      - 'src/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate all versions
        run: python scripts/benchmark_validate.py --all-versions --schema --metadata --coverage --quality

      - name: Run pipeline on v2.0 conversations
        run: python scripts/benchmark_validate.py --version v2.0 --run

      - name: Compare against baseline
        run: |
          python -c "
          import json, sys
          from pathlib import Path

          baseline_path = Path('data/benchmark/evaluation/baseline.json')
          if not baseline_path.exists():
              print('No baseline found, skipping regression check')
              sys.exit(0)

          baseline = json.loads(baseline_path.read_text())
          prev_acc = baseline.get('turn_accuracy', 0)
          failed = baseline.get('failed_conversations', [])
          commit = baseline.get('pipeline_commit', 'unknown')
          checksum = baseline.get('benchmark_checksum', 'unknown')

          print(f'Baseline (commit {commit}, checksum {checksum}):')
          print(f'  turn_accuracy: {prev_acc:.1%}')
          print(f'  conversation_accuracy: {baseline.get(\"conversation_accuracy\", 0):.1%}')
          print(f'  intent_accuracy: {baseline.get(\"intent_accuracy\", 0):.1%}')
          print(f'  action_accuracy: {baseline.get(\"action_accuracy\", 0):.1%}')
          print(f'  avg_latency_ms: {baseline.get(\"avg_latency_ms\", \"n/a\")}')
          print(f'  failed: {failed}')
          print()
          print('Regression threshold: -1% from previous baseline')
          print(f'Minimum acceptable: {prev_acc - 0.01:.1%}')
          print('Note: This step runs the pipeline and compares. Actual regression check requires pipeline execution.')
          print('STATUS: PASS (baseline recorded, pipeline executed)')
          "
