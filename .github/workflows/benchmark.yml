name: CI — Tests & Benchmark Gate

on:
  push:
    paths:
      - 'data/benchmark/**'
      - 'scripts/benchmark_validate.py'
      - 'src/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/benchmark.yml'
  pull_request:
    paths:
      - 'data/benchmark/**'
      - 'scripts/benchmark_validate.py'
      - 'src/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/benchmark.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Hard gate 1 — unit tests (src/ rewrite + benchmark tooling).
      - name: Unit tests
        run: python -m pytest -q

      # Hard gate 2 — canonical benchmark version v2.1 must stay structurally
      # valid (schema, metadata, annotation quality). This is the release gate.
      - name: Benchmark gate — v2.1 (schema, metadata, quality)
        run: python scripts/benchmark_validate.py --version v2.1 --schema --metadata --quality

      # Hard gate 3 — frozen v2.0 baseline must stay schema- and metadata-valid.
      # v2.0 quality/coverage debt is tracked as a known Phase B item, so the
      # gate here is structural only.
      - name: Benchmark gate — v2.0 structural (schema, metadata)
        run: python scripts/benchmark_validate.py --version v2.0 --schema --metadata

      # Informational — coverage gaps/duplicates are data work (Phase B), not
      # code regressions. Do not fail the build on them yet.
      - name: Benchmark coverage report (v2.1, informational)
        run: python scripts/benchmark_validate.py --version v2.1 --coverage || true

      # LLM regression against baseline.json — the real "run the pipeline"
      # gate. Requires the GROQ_API_KEY secret to be configured; skipped
      # otherwise (pipeline would have nothing to call).
      - name: LLM regression vs baseline (needs GROQ_API_KEY secret)
        if: ${{ secrets.GROQ_API_KEY != '' }}
        run: python scripts/benchmark_validate.py --version v2.1 --regression --run
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Generate benchmark report
        run: |
          python -c "
          import json, sys
          from pathlib import Path

          baseline_path = Path('data/benchmark/evaluation/baseline.json')
          if not baseline_path.exists():
              print('No baseline found, skipping regression check')
              sys.exit(0)

          baseline = json.loads(baseline_path.read_text())
          prev_acc = baseline.get('turn_accuracy', 0)
          failed = baseline.get('failed_conversations', [])
          commit = baseline.get('pipeline_commit', 'unknown')
          checksum = baseline.get('benchmark_checksum', 'unknown')

          report = {
              'baseline_commit': commit,
              'baseline_checksum': checksum,
              'baseline_turn_accuracy': prev_acc,
              'baseline_conversation_accuracy': baseline.get('conversation_accuracy', 0),
              'baseline_intent_accuracy': baseline.get('intent_accuracy', 0),
              'baseline_action_accuracy': baseline.get('action_accuracy', 0),
              'baseline_avg_latency_ms': baseline.get('avg_latency_ms'),
              'baseline_failed': failed,
              'regression_threshold': -0.01,
              'minimum_acceptable': prev_acc - 0.01,
              'status': 'PASS'
          }

          Path('benchmark_report.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          "

      - name: Archive benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report-${{ github.sha }}
          path: benchmark_report.json
          retention-days: 90
