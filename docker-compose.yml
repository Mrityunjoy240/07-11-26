services:
  redis:
    image: redis:7-alpine
    container_name: bcrec-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --save 60 1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: bcrec-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: bcrec
      POSTGRES_USER: bcrec
      POSTGRES_PASSWORD: bcrec_dev
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bcrec"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
  postgres-data:
